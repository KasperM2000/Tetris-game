<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tetris Bane</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background-color: #1a1a1a;
      }
      #app {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .game-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        order: 1;
      }

      #held-piece-label {
        order: 0;
      }

      .game-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        order: 2;
      }
      
      /* Brættet: 10 kolonner x 20 rækker á 25px */
      #tetris-board {
        display: grid;
        grid-template-columns: repeat(10, 25px);
        grid-template-rows: repeat(20, 25px);
        /* farven til borderen rundt omkring*/
        border: 2px solid #555;
        /* farven til boardet*/
        background-color: #111;
      }
      .score-display {
        color: white;
        font-size: 24px;
      }
      /* Hvert felt */
      .cell { 
        border: 1px solid #222;
        box-sizing: border-box;
      }
      #start-button {
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      .cell.filled-L { background-color: #e9a207;}
      .cell.filled-J { background-color: #0d05e7;}
      .cell.filled-I { background-color: #44d7e8;}
      .cell.filled-O { background-color: #e8e844;}
      .cell.filled-T { background-color: #6e0495;}
      .cell.filled-S { background-color: #02fa02;}
      .cell.filled-Z { background-color: #e70a0a;}

      #held-piece-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        align-self: center;
        gap: 10px;
        border: 2px solid #555;
        background-color: #111;
        color: white;
        padding: 12px;
      }

      .held-piece-preview {
        display: grid;
        grid-template-columns: repeat(4, 25px);
        grid-template-rows: repeat(4, 25px);
      }
      
    </style>
  </head>
