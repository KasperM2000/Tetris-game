<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tetris Bane</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background-color: #1a1a1a;
      }
      #app {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      
      /* Brættet: 10 kolonner x 20 rækker á 25px */
      #tetris-board {
        display: grid;
        grid-template-columns: repeat(10, 25px);
        grid-template-rows: repeat(20, 25px);
        /* farven til borderen rundt omkring*/
        border: 2px solid #555;
        /* farven til boardet*/
        background-color: #111;
      }

      /* Hvert felt */
      .cell { 
        border: 1px solid #222;
        box-sizing: border-box;
      }
      
      .cell.filled-L { background-color: #44d7e8;}
      .cell.filled-J { background-color: #e84444;}
      .cell.filled-I { background-color: #44e844;}
      .cell.filled-O { background-color: #e8e844;}
      .cell.filled-T { background-color: #e844e8;}
      .cell.filled-S { background-color: #e8a844;}
      .cell.filled-Z { background-color: #a844e8;}
      
    </style>
  </head>

    <main id="app">
      <button id="start-button">Start</button>
